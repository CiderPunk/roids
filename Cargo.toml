[package]
name = "roids"
version = "0.1.0"
edition = "2024"

[dependencies.bevy]
version="0.16.1"


[features]
watcher = [
  "bevy/file_watcher",
  "bevy/embedded_watcher",
]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# for Windows
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[dependencies]
rand = "0.9.2"

[target.wasm32-unknown-unknown]
runner = "wasm-server-runner"


[alias]
r = "run --features watcher"